<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Liquid Glass background with subtle Spotify Green ambient glow -->
    <radialGradient id="liquid-glow" cx="20%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0a180f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glass-specular" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#1ed760" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="500" height="500" rx="24" fill="url(#liquid-glow)"/>
  
  <!-- Liquid Glass Overlay panel with border reflection -->
  <rect x="20" y="20" width="460" height="460" rx="20" fill="url(#glass-specular)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  
  <!-- Spotify Vinyl Disc with signature green center -->
  <circle cx="250" cy="225" r="145" fill="#0c0c0e" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <circle cx="250" cy="225" r="115" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  <circle cx="250" cy="225" r="85" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  
  <!-- Green center label -->
  <circle cx="250" cy="225" r="50" fill="#1ed760" opacity="0.95"/>
  <circle cx="250" cy="225" r="14" fill="#000000"/>
  
  <!-- Spotify Sound Wave Lines -->
  <rect x="235" y="210" width="4" height="30" rx="2" fill="#000000"/>
  <rect x="243" y="203" width="4" height="44" rx="2" fill="#000000"/>
  <rect x="251" y="200" width="4" height="50" rx="2" fill="#000000"/>
  <rect x="259" y="207" width="4" height="36" rx="2" fill="#000000"/>
  
  <!-- Header Pill Badge -->
  <rect x="44" y="44" width="136" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="#1ed760" stroke-width="1"/>
  <text x="112" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#1ed760" letter-spacing="1.5" text-anchor="middle">SPOTIFY LOSSLESS</text>
  
  <!-- Title & Subtitle -->
  <text x="44" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Audiophile 96k</text>
  <text x="44" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1ed760" letter-spacing="1.5">STUDIO LOSSLESS</text>
</svg>