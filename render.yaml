# Sonora — Autonomous Lossless Music Streaming Platform
# Render.com 100% Free Tier Deployment Configuration

services:
  - type: web
    name: sonora-music
    env: node
    plan: free
    buildCommand: |
      npm install
      apt-get update -y && apt-get install -y python3 python3-pip ffmpeg
      pip3 install yt-dlp --break-system-packages || pip3 install yt-dlp
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
