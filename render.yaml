# Sonora — Autonomous Lossless Music Streaming Platform
# Render.com 100% Free Tier Deployment Configuration

services:
  - type: web
    name: sonora-music
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
